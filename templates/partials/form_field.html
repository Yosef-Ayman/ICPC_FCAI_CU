<div class="{% if field.name == 'bio' or field.name == 'description' %}sm:col-span-2{% endif %}">
  <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-neutral-800">{{ field.label }}</label>
  {{ field }}
  {% for e in field.errors %}<p class="mt-1.5 text-xs text-red-600">{{ e }}</p>{% endfor %}
</div>
