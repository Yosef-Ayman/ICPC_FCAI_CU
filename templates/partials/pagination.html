{% if page.has_other_pages %}
<div class="mt-6 flex items-center justify-between text-sm">
  {% if page.has_previous %}<a href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}" class="font-semibold hover:underline">← Previous</a>{% else %}<span></span>{% endif %}
  <span class="text-neutral-400">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}" class="font-semibold hover:underline">Next →</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
