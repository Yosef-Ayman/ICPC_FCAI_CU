<div>
  <label for="id_{{ name }}" class="block text-sm font-semibold text-neutral-800">{{ label }}</label>
  <input id="id_{{ name }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default:'' }}"
    class="mt-2 w-full rounded-xl border px-4 py-3 text-sm outline-none transition focus:border-[#2b6aad] focus:ring-4 focus:ring-[#2b6aad]/10 {% if error %}border-red-300 bg-red-50{% else %}border-neutral-300 bg-white{% endif %}" />
  {% if error %}<p class="mt-1.5 text-xs text-red-600">{{ error }}</p>{% endif %}
</div>
